# Existing Render service: apply these fields in Settings if not managed by Blueprint.
services:
 - type: web
   name: dexman
   runtime: node
   plan: free
   rootDir: dexman
   buildCommand: npm ci --include=dev && npm run build
   startCommand: npm start
   healthCheckPath: /health
   envVars:
    - key: NODE_VERSION
      value: 22.22.0
# Repository root: this file. Only the lobby server is deployed to Render.
services:
  - type: web
    name: dexman-server
    runtime: node
    plan: free
    rootDir: dexman/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
